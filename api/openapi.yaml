          description: Replace all signature placements (omit to leave unchanged)
          items:
            $ref: "#/components/schemas/SignaturePlacementInput"
          type: array
    createRequest_request:
      properties:
        template_id:
          description: ID of the template to fill
          format: uuid
          type: string
        fields:
          additionalProperties:
            type: string
            x-additionalPropertiesName: field_name
          description: Map of field names to values. Text fields accept strings. Checkbox
            fields accept "checked" or "unchecked".
        signers:
          additionalProperties:
            allOf:
            - $ref: "#/components/schemas/SignerInput"
            x-additionalPropertiesName: signer_label
          description: |
            Map of signer label to signer configuration. Each key is a signer label defined in the template's signature placements. Omit entirely for fill-only requests.
