          description: Custom message included in signing emails sent to signers.
          maxLength: 1024
          type: string
        metadata:
          additionalProperties:
            maxLength: 1024
            type: string
            x-additionalPropertiesName: key
          description: "Arbitrary key-value pairs for your own use (max 10 keys, key\
            \ max 128 chars, value max 1024 chars)"
          maxProperties: 10
        allow_typed_signature:
          default: true
