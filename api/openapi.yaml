      responses:
        "204":
          description: Webhook deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Delete webhook
      tags:
      - Webhooks
    get:
      description: Returns a single webhook.
      operationId: getWebhook
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                webhook:
                  id: b1c2d3e4-5678-9abc-def0-1234567890ab
                  url: https://example.com/webhook
                  events:
                  - request.success
                  - signer.signed
                  active: true
                  created_at: 2026-03-23T10:00:00Z
                  updated_at: 2026-03-28T17:35:16-05:00
              schema:
                $ref: "#/components/schemas/WebhookResponse"
          description: Webhook details
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Get webhook
      tags:
      - Webhooks
    patch:
      description: "Change the webhook URL, subscribed events, or active status. Omitted\
        \ fields are left unchanged."
      operationId: updateWebhook
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
