  /webhooks/{id}/test:
    post:
      description: |
        Sends a test event payload to the webhook URL. Use this to verify
        your endpoint is correctly receiving and processing webhook deliveries.
      operationId: testWebhook
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
